name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, Test & Publish @siliconvalleyglobal/slopguard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install
        working-directory: packages/ts-bindings

      - name: Run Type Check
        run: npm run typecheck
        working-directory: packages/ts-bindings

      - name: Run Tests
        run: npm run test
        working-directory: packages/ts-bindings

      - name: Build Package
        run: npm run build
        working-directory: packages/ts-bindings

      - name: Publish to npm with Provenance
        run: npm publish --provenance --access public
        working-directory: packages/ts-bindings
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
