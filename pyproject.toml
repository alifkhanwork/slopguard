[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slopguard"
version = "0.1.0"
description = "Defend against slopsquatting attacks targeting AI coding agent package hallucinations."
readme = "README.md"
authors = [
    { name = "SVG Security", email = "security@svg.ph" }
]
license = "MIT"
requires-python = ">=3.9"

dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[tool.setuptools]
packages = ["slopguard", "slopguard.detection", "slopguard.scoring", "slopguard.interceptor", "slopguard.intel"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.23.0",
]

[project.scripts]
slopguard = "slopguard.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
